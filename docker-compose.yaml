version: '3.5'

services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    networks:
      app_net:
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    networks:
      app_net:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-请修改为MinIO密码}
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data  --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.3.5
    networks:
      app_net:
        ipv4_address: 172.16.238.10
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"

  mysql:
      container_name: img-search-mysql
      image: mysql:8.0
      networks:
        app_net:
          ipv4_address: 172.17.0.3
      environment:
        - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-请修改为MySQL密码}
      volumes:
        - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/mysql:/var/lib/mysql
      ports:
        - "3306:3306"
  webserver:
        container_name: img-search-ai
        image: img-search-server:4.0
        networks:
          app_net:
            ipv4_address: 172.16.238.12
        environment:
          MILVUS_HOST: '172.16.238.10'
          MYSQL_HOST: '172.17.0.3'
          MYSQL_PWD: '${MYSQL_PWD:-请修改为MySQL密码}'
          MINIO_HOST: 'minio'
          VECTOR_DIMENSION: '1024'
          METRIC_TYPE: 'IP'
          MODEL_DIR: '/app/ai-model'
          JWT_SECRET: '${JWT_SECRET:-请修改为随机长字符串}'
          TOKEN_EXPIRE_DAYS: '7'
          ADMIN_USER: '${ADMIN_USER:-admin}'
          ADMIN_PASSWORD: '${ADMIN_PASSWORD:-请修改为强密码}'
          LOG_RETENTION_DAYS: '10'
          BACKUP_DIR: '/app/backups'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          INFER_CONCURRENCY: '6'
          BACKUP_RETENTION_DAYS: '30'
        volumes:
          - ./data:/data
          - ./src:/app/src
          - ./ai-model:/app/ai-model
          - ./backups:/app/backups
        restart: always
        depends_on:
          - standalone
          - mysql
        ports:
          - "5000:8000"
        working_dir: /app/src
        command: bash -c "pip install -r /app/src/requirements.txt && gunicorn -w 4 -k uvicorn.workers.UvicornWorker --threads 2 --bind 0.0.0.0:8000 main:app"

    
  attu:
    container_name: attu
    image: zilliz/attu:v2.3.6
    environment:
      MILVUS_URL: ${MILVUS_HOST:-milvus-standalone}:19530
    ports:
      - "8100:3000"  # 外部端口8000可以自定义
    depends_on:
      - "standalone"

networks:
  app_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.16.238.0/24
          gateway: 172.16.238.1
